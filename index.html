<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Banner Landing Page</title>
    <meta
      name="description"
      content="Simple banner-based landing page deployed easily on Hostinger."
    />
    <meta
      name="keywords"
      content="banner website, landing page, hostinger, ads"
    />
    <meta name="author" content="Your Name" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <h2 class="logo">BannerSite</h2>
      <nav>
        <a href="#">Home</a>
        <a href="#">Offers</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <!-- HERO BANNER -->
    <a
      href="https://essencemobi.com/?utm_source=dev_02&utm_medium=cpc&utm_campaign=dev_03"
      class="banner hero-banner fade-in"
      target="_blank"
      rel="noopener"
    >
      <img src="images/banner1.png" alt="Hero Banner" loading="lazy" />

      <div class="banner-text">
        <h1>Big Hero Banner</h1>
        <p>Perfect for promotions</p>
        <span class="btn">Explore Now</span>
      </div>
    </a>

    <!-- MEDIUM BANNER -->
    <section class="banner medium-banner fade-in">
      <a
        href="https://essencemobi.com/?utm_source=dev_02&utm_medium=cpc&utm_campaign=dev_03"
        class="banner medium-banner fade-in"
        target="_blank"
        rel="noopener"
      >
        <img src="images/banner2.jpg" alt="Medium Banner" loading="lazy" />

        <div class="banner-text">
          <h2>Special Offer</h2>
          <span class="btn small">View Deal</span>
        </div>
      </a>
    </section>

    <!-- SMALL BANNERS -->
    <section class="small-banner-wrapper fade-in">
      <a
        href="https://essencemobi.com/?utm_source=dev_02&utm_medium=cpc&utm_campaign=dev_03"
        class="banner small-banner"
        target="_blank"
        rel="noopener"
      >
        <img src="images/banner3.jpg" alt="Small Banner 1" loading="lazy" />
        <div class="overlay">Banner 3</div>
      </a>

      <a
        href="https://essencemobi.com/?utm_source=dev_02&utm_medium=cpc&utm_campaign=dev_03"
        class="banner small-banner"
        target="_blank"
        rel="noopener"
      >
        <img src="images/banner4.jpg" alt="Small Banner 2" loading="lazy" />
        <div class="overlay">Banner 4</div>
      </a>
    </section>

    <!-- CONTACT FORM -->
<!-- CONTACT FORM -->
<section class="contact-section fade-in" id="contact">
  <h2>Contact Us</h2>
  <p class="form-subtitle">
    Fill the form and we’ll get back to you shortly
  </p>

  <form class="contact-form" action="#" method="post">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter 10-digit phone number"
        pattern="[0-9]{10}"
        required
      />
    </div>

    <button type="submit" class="submit-btn">
      Submit
    </button>
  </form>
</section>


    <!-- FOOTER -->
    <footer>
      <p>© 2026 Banner Website • All Rights Reserved</p>
    </footer>
  </body>
</html>
