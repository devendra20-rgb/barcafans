<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 2 - Verification</title>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    body { font-family: Arial; background:#f0f4f8; padding:40px; }
    .box {
      max-width:500px;
      margin:auto;
      background:#fff;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 15px rgba(0,0,0,.1);
    }
    label { display:block; margin:15px 0 5px; }
    input, button {
      width:100%;
      padding:12px;
      margin-top:5px;
    }
    button {
      margin-top:25px;
      background:#10b981;
      color:#fff;
      border:none;
      border-radius:6px;
      cursor:pointer;
    }
    .recaptcha-wrapper {
      margin:20px 0;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Step 2 – Verify & Submit</h2>

  <form onsubmit="return handleSubmit()">
  <label>Phone Number</label>
  <input type="tel" id="phone" required pattern="[0-9]{10}">

  <div class="recaptcha-wrapper">
    <div class="g-recaptcha"
         data-sitekey="6LeNFmcsAAAAAALop3WQjzp8O8epwvhfxfiypr7R">
    </div>
  </div>

  <button type="submit">Final Submit</button>
</form>

<script>
  function handleSubmit() {
    const phone = document.getElementById("phone").value;
    const captchaResponse = grecaptcha.getResponse();

    // Phone validation (HTML pattern already checks, this is extra safety)
    if (!/^\d{10}$/.test(phone)) {
      alert("Please enter a valid 10-digit phone number");
      return false;
    }

    // CAPTCHA validation
    if (!captchaResponse) {
      alert("Please complete the CAPTCHA");
      return false;
    }

    // ✅ All good → redirect
    window.location.href = "https://www.wikipedia.org";
    return false; // prevent normal form submit
  }
</script>
